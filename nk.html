<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hero Swiper Slider</title>

    <!-- Swiper CSS -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"
    />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
      }

      body {
        background: #f5f7fb;
      }

      section {
        width: 100%;
      }

      .swiper {
        width: 100%;
        height: 100vh;
      }

      .swiper-slide {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 80px 8%;
        background: linear-gradient(135deg, #e3f2fd, #ffffff);
      }

      .hero-content {
        width: 50%;
      }

      .hero-content h1 {
        font-size: 48px;
        margin-bottom: 20px;
      }

      .hero-content p {
        font-size: 16px;
        line-height: 1.6;
        margin-bottom: 25px;
        color: #555;
      }

      .hero-content button {
        padding: 12px 25px;
        background: #007bff;
        border: none;
        color: #fff;
        font-size: 15px;
        border-radius: 5px;
        cursor: pointer;
      }

      .hero-content button:hover {
        background: #0056b3;
      }

      .swiper-slide img {
        width: 40%;
        max-width: 500px;
      }

      /* Navigation Color */
      .swiper-button-next,
      .swiper-button-prev {
        color: #007bff;
      }

      /* Responsive */
      @media (max-width: 992px) {
        .swiper-slide {
          flex-direction: column;
          text-align: center;
        }
        .hero-content {
          width: 100%;
        }
        .swiper-slide img {
          width: 80%;
          margin-top: 30px;
        }
      }
    </style>
  </head>

  <body>
    <section>
      <div class="swiper heroSwiper">
        <div class="swiper-wrapper">
          <div class="swiper-slide">
            <div class="hero-content">
              <h1>Let’s Plan Your Next Trip</h1>
              <p>
                Explore beautiful destinations with trusted services and smooth
                travel experiences.
              </p>
              <button>Explore More</button>
            </div>
            <img
              src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e"
              alt=""
            />
          </div>

          <div class="swiper-slide">
            <div class="hero-content">
              <h1>Discover Amazing Places</h1>
              <p>
                Comfortable stays, flexible packages and stress-free travel
                planning.
              </p>
              <button>Explore More</button>
            </div>
            <img
              src="https://images.unsplash.com/photo-1493558103817-58b2924bce98"
              alt=""
            />
          </div>

          <div class="swiper-slide">
            <div class="hero-content">
              <h1>Travel With Confidence</h1>
              <p>
                Secure booking and personalized tours for unforgettable
                journeys.
              </p>
              <button>Explore More</button>
            </div>
            <img
              src="https://images.unsplash.com/photo-1501785888041-af3ef285b470"
              alt=""
            />
          </div>
        </div>

        <!-- Navigation -->
        <div class="swiper-button-next"></div>
        <div class="swiper-button-prev"></div>

        <!-- Pagination -->
        <div class="swiper-pagination"></div>
      </div>
    </section>

    <!-- Swiper JS -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

    <script>
      var swiper = new Swiper(".heroSwiper", {
        slidesPerView: 1,
        loop: true,
        autoplay: {
          delay: 3000,
          disableOnInteraction: false,
        },
        navigation: {
          nextEl: ".swiper-button-next",
          prevEl: ".swiper-button-prev",
        },
        pagination: {
          el: ".swiper-pagination",
          clickable: true,
        },
      });
    </script>
  </body>
</html>
